<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarieven | Mijn Animatie Paspoort</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="index.html">
            <img src="logo.svg" alt="Mijn Animatie Paspoort">
        </a>

        <nav class="nav" id="site-nav" aria-label="Hoofdnavigatie">
            <a href="persoonlijke-animaties.html">Persoonlijke animaties (MAP)</a>
            <a class="nav-mapx" href="uitleg-animaties.html">Uitleg animaties (MAP-X)</a>
            <a href="index.html#voorbeelden">Voorbeelden</a>
            <a href="over-mij.html">Over mij</a>
            <a class="is-active" href="tarieven.html">Tarieven</a>
            <a href="contact.html">Contact</a>
        </nav>

        <div class="header-actions">
            <a class="header-button header-button-ghost" href="contact.html">Plan een gesprek</a>
            <a class="header-button header-button-primary" href="contact.html">Vraag een animatie aan</a>
            <button class="menu-button" type="button" aria-label="Menu" aria-controls="site-nav" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main class="legal-page">
        <section class="legal-hero">
            <p class="section-label">Tarieven</p>
            <h1>Tarieven</h1>
            <p></p>
        </section>

        <section class="legal-content" aria-label="Tarieven">
        </section>
    </main>

    <script>
        const siteHeader = document.querySelector(".site-header");
        const menuButton = document.querySelector(".menu-button");
        const navLinks = document.querySelectorAll(".nav a");

        function setMenuOpen(isOpen) {
            if (!siteHeader || !menuButton) {
                return;
            }

            siteHeader.classList.toggle("is-menu-open", isOpen);
            menuButton.setAttribute("aria-expanded", String(isOpen));
        }

        if (menuButton) {
            menuButton.addEventListener("click", () => {
                setMenuOpen(!siteHeader.classList.contains("is-menu-open"));
            });
        }

        navLinks.forEach((link) => {
            link.addEventListener("click", () => setMenuOpen(false));
        });
    </script>
</body>
</html>
